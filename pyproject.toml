[project]
name = "mbta-api"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.128.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.1",
    "uvicorn==0.40.0",
    "pydantic==2.12.5",
]

[project.scripts]
app = "src.api.main:app"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"